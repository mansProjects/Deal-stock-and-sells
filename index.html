<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload-stock</title>
    <link rel="stylesheet" href="thisIndex.css">
    <script src="https://kit.fontawesome.com/d1263eec41.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h2>UPLOAD STOCK</h2>
    </header>
    <main>
        
        <div class="soldOftheDay">
            <p>Entrees / Sorties</p>
            <div class="circle">
                <p></p>
            </div>
        </div>
        <section class="articleForm">
    <h3>Remplissez le formulaire :</h3>
    <form id="myForm">
        <label for="Article">Choisissez l'article :</label>
        <select name="Article" id="Article" required>
            <option value="R50I">R50I</option>
            <option value="P20I">P20I</option>
             <option value="K20I">K20I</option>
            <option value="P30I">P30I</option>
            <option value="REDMI">REDMI</option>
            <option value="SONY">SONY</option>
            <option value="JBL">JBL</option>
        </select>
        
        <input type="number" name="Prix" id="prix" placeholder="PRIX DE VENTE" required>
        <input type="number" name="Depenses" id="depenses" placeholder="DEPENSES" required>
        <input type="number" name="NbrePiece" id="nbrepiece" placeholder="NOMBRE PIECE" required>
        <input type="submit" value="Gerer">
    </form>
</section>

<!-- Script JavaScript pour gérer l'envoi de manière fluide -->
<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbzix7O5txSzGZekVSxzK8iR-ucJp0Kk5cFh3a5HzmNhHcZ2lfO-62sNR8sDVfk82CUv2Q/exec'; // Gardez votre URL exacte ici

const form = document.getElementById('myForm');
form.addEventListener('submit', e => {
  e.preventDefault(); // Empêche la page de recharger ou de s'ouvrir sur Google
  
  fetch(scriptURL, { 
    method: 'POST', 
    mode: 'no-cors', // Indispensable pour autoriser GitHub à parler à Google
    body: new FormData(form) 
  })
  .then(() => {
    alert("Données enregistrées avec succès !");
    form.reset(); // Vide le formulaire après l'envoi
  })
  .catch(error => console.error('Erreur!', error.message));
});
</script>
    </main>
    <br><br>
</body>
</html>
